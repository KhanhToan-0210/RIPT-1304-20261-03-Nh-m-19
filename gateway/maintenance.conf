server {
    listen 8080;
    server_name _;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-ShopOnline-Gateway-Generation "0" always;

    location = /live {
        return 200 '{"status":"alive","mode":"maintenance","environment":"test"}';
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        add_header X-ShopOnline-Gateway-Generation "0" always;
        return 503 '{"success":false,"code":"MAINTENANCE","environment":"test","writer":null}';
    }
}
