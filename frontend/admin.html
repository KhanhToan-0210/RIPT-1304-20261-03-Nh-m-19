<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Quản Trị - HP Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <i class="fa-solid fa-shield-halved"></i> LNT Store - Quản Trị Hệ Thống
      </a>
      <nav class="nav-links">
        <a href="index.html"><i class="fa-solid fa-house"></i> Về Cửa Hàng</a>
        <a href="admin.html" class="active"><i class="fa-solid fa-gauge"></i> Bảng Điều Khiển</a>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    <div class="admin-tabs">
      <button class="tab-btn active" onclick="switchTab('products')">
        <i class="fa-solid fa-box"></i> Quản Lý Sản Phẩm (Thêm / Sửa / Xóa)
      </button>
      <button class="tab-btn" onclick="switchTab('orders')">
        <i class="fa-solid fa-list-check"></i> Quản Lý Đơn Hàng
      </button>
    </div>

    <!-- Tab Quản lý sản phẩm -->
    <section id="tab-products" class="tab-pane active">
      <div class="admin-grid">
        <!-- Form thêm / sửa sản phẩm -->
        <div class="card form-card">
          <h4 id="form-title"><i class="fa-solid fa-plus-circle"></i> Thêm Sản Phẩm Mới</h4>
          <form id="product-form" onsubmit="handleProductSubmit(event)">
            <input type="hidden" id="p-id">
            <div class="form-group">
              <label for="p-name">Tên sản phẩm *</label>
              <input type="text" id="p-name" required placeholder="Nhập tên sản phẩm">
            </div>
            <div class="form-group">
              <label for="p-price">Giá bán (VNĐ) *</label>
              <input type="number" id="p-price" required placeholder="Ví dụ: 15000000">
            </div>
            <div class="form-group">
              <label for="p-stock">Số lượng tồn kho *</label>
              <input type="number" id="p-stock" required placeholder="Ví dụ: 10">
            </div>
            <div class="form-group">
              <label for="p-image">Link hình ảnh (URL)</label>
              <input type="url" id="p-image" placeholder="https://...">
            </div>
            <div class="form-group">
              <label for="p-desc">Mô tả sản phẩm</label>
              <textarea id="p-desc" rows="3" placeholder="Thông số kỹ thuật, mô tả..."></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="btn-save-product">Lưu Sản Phẩm</button>
              <button type="button" class="btn btn-secondary" onclick="resetProductForm()" id="btn-cancel-edit"
                style="display: none;">Hủy</button>
            </div>
          </form>
        </div>

        <!-- Bảng danh sách sản phẩm hiện tại -->
        <div class="card table-card">
          <h4>Danh Sách Sản Phẩm Trong Kho</h4>
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Ảnh</th>
                  <th>Tên</th>
                  <th>Giá</th>
                  <th>Kho</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody id="admin-product-tbody">
                <!-- Render via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- Tab Quản lý đơn hàng -->
    <section id="tab-orders" class="tab-pane">
      <div class="card">
        <h4><i class="fa-solid fa-truck-fast"></i> Danh Sách Đơn Hàng Đã Đặt</h4>
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Mã Đơn</th>
                <th>Khách Hàng</th>
                <th>SĐT</th>
                <th>Địa Chỉ</th>
                <th>Chi Tiết Mặt Hàng</th>
                <th>Tổng Tiền</th>
                <th>Thời Gian</th>
                <th>Trạng Thái</th>
              </tr>
            </thead>
            <tbody id="admin-orders-tbody">
              <!-- Render via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-content">
      <p>&copy; 2026 LNT Store - Hệ Thống Quản Trị.</p>
    </div>
  </footer>

  <script src="js/admin.js"></script>
</body>

</html>
